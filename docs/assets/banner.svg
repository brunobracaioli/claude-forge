<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f0f1a"/>
      <stop offset="50%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
    <linearGradient id="spark1" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#fbbf24" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark2" x1="0" y1="1" x2="0.3" y2="0">
      <stop offset="0%" stop-color="#ef4444" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f97316" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="spark3" x1="0.2" y1="1" x2="0" y2="0">
      <stop offset="0%" stop-color="#fbbf24" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="glow" x1="0.5" y1="0.5" x2="0.5" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="320" fill="url(#bg)"/>

  <!-- Subtle grid pattern -->
  <g opacity="0.03" stroke="#ffffff" stroke-width="0.5">
    <line x1="0" y1="80" x2="1280" y2="80"/>
    <line x1="0" y1="160" x2="1280" y2="160"/>
    <line x1="0" y1="240" x2="1280" y2="240"/>
    <line x1="320" y1="0" x2="320" y2="320"/>
    <line x1="640" y1="0" x2="640" y2="320"/>
    <line x1="960" y1="0" x2="960" y2="320"/>
  </g>

  <!-- Ambient glow behind anvil area -->
  <ellipse cx="220" cy="210" rx="120" ry="80" fill="url(#glow)"/>

  <!-- Anvil silhouette -->
  <g transform="translate(155, 108)" opacity="0.9">
    <!-- Anvil body -->
    <path d="M30 100 L20 70 L40 40 L90 40 L110 25 L130 25 L130 40 L110 40 L100 70 L110 100 Z" fill="#2a2a3e" stroke="#3a3a52" stroke-width="1"/>
    <!-- Anvil top face -->
    <path d="M40 40 L90 40 L100 70 L20 70 Z" fill="#35354d" stroke="#3a3a52" stroke-width="0.5"/>
    <!-- Anvil horn -->
    <path d="M90 40 L110 25 L130 25 L130 40 L110 40 Z" fill="#30304a" stroke="#3a3a52" stroke-width="0.5"/>
    <!-- Base -->
    <rect x="15" y="100" width="100" height="12" rx="2" fill="#252538" stroke="#3a3a52" stroke-width="0.5"/>
  </g>

  <!-- Spark particles -->
  <g>
    <!-- Main sparks going up-right -->
    <line x1="225" y1="152" x2="240" y2="125" stroke="url(#spark1)" stroke-width="2" stroke-linecap="round"/>
    <line x1="230" y1="148" x2="258" y2="115" stroke="url(#spark2)" stroke-width="1.5" stroke-linecap="round"/>
    <line x1="220" y1="150" x2="232" y2="108" stroke="url(#spark3)" stroke-width="1.8" stroke-linecap="round"/>
    <line x1="235" y1="150" x2="265" y2="128" stroke="url(#spark1)" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="228" y1="145" x2="250" y2="100" stroke="url(#spark2)" stroke-width="1" stroke-linecap="round"/>

    <!-- Spark dots -->
    <circle cx="242" cy="122" r="2" fill="#fbbf24" opacity="0.9"/>
    <circle cx="260" cy="112" r="1.5" fill="#f59e0b" opacity="0.7"/>
    <circle cx="235" cy="105" r="1.8" fill="#fbbf24" opacity="0.8"/>
    <circle cx="268" cy="125" r="1.2" fill="#f97316" opacity="0.6"/>
    <circle cx="253" cy="96" r="1" fill="#fbbf24" opacity="0.5"/>
    <circle cx="270" cy="108" r="1.3" fill="#f59e0b" opacity="0.4"/>

    <!-- Small scattered sparks -->
    <circle cx="280" cy="118" r="0.8" fill="#fbbf24" opacity="0.3"/>
    <circle cx="248" cy="90" r="0.7" fill="#f59e0b" opacity="0.25"/>
    <circle cx="275" cy="100" r="0.6" fill="#fbbf24" opacity="0.2"/>
  </g>

  <!-- Hammer hint (subtle, resting) -->
  <g transform="translate(195, 100) rotate(-35)" opacity="0.5">
    <rect x="0" y="0" width="8" height="50" rx="2" fill="#3a3a52"/>
    <rect x="-4" y="-8" width="16" height="12" rx="2" fill="#45455e"/>
  </g>

  <!-- Main title -->
  <text x="400" y="145" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="64" font-weight="700" fill="#ffffff" letter-spacing="-1">
    Claude Forge
  </text>

  <!-- Accent line under title -->
  <rect x="402" y="162" width="120" height="3" rx="1.5" fill="url(#accent)"/>

  <!-- Tagline -->
  <text x="403" y="195" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="20" fill="#8b8fa3" font-weight="400" letter-spacing="0.5">
    Forge your .claude/ in one command
  </text>

  <!-- Stack pills -->
  <g transform="translate(403, 220)">
    <rect x="0" y="0" width="68" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="34" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Flask</text>

    <rect x="78" y="0" width="68" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="112" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Next.js</text>

    <rect x="156" y="0" width="62" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="187" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Node</text>

    <rect x="228" y="0" width="68" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="262" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Python</text>

    <rect x="306" y="0" width="62" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="337" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">React</text>

    <rect x="378" y="0" width="56" height="26" rx="13" fill="#1e293b" stroke="#334155" stroke-width="0.5"/>
    <text x="406" y="17" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#94a3b8" text-anchor="middle">Rust</text>
  </g>

  <!-- Right side: terminal mockup -->
  <g transform="translate(870, 85)">
    <!-- Terminal window -->
    <rect x="0" y="0" width="350" height="155" rx="8" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
    <!-- Title bar -->
    <rect x="0" y="0" width="350" height="28" rx="8" fill="#161b22"/>
    <rect x="0" y="20" width="350" height="8" fill="#161b22"/>
    <!-- Traffic lights -->
    <circle cx="16" cy="14" r="5" fill="#f85149" opacity="0.8"/>
    <circle cx="34" cy="14" r="5" fill="#d29922" opacity="0.8"/>
    <circle cx="52" cy="14" r="5" fill="#3fb950" opacity="0.8"/>
    <!-- Terminal title -->
    <text x="175" y="18" font-family="'SF Mono', monospace" font-size="11" fill="#484f58" text-anchor="middle">claude-code</text>

    <!-- Terminal content -->
    <text x="14" y="52" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#8b949e">$</text>
    <text x="28" y="52" font-family="'SF Mono', 'Fira Code', monospace" font-size="12" fill="#c9d1d9">/claude-forge flask-next</text>

    <text x="14" y="74" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950">✓</text>
    <text x="28" y="74" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e">Created .claude/rules/ (5 files)</text>

    <text x="14" y="92" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950">✓</text>
    <text x="28" y="92" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e">Created .claude/commands/ (4 files)</text>

    <text x="14" y="110" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950">✓</text>
    <text x="28" y="110" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e">Created .claude/agents/ (2 files)</text>

    <text x="14" y="128" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#3fb950">✓</text>
    <text x="28" y="128" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#8b949e">Generated CLAUDE.md (87 lines)</text>

    <text x="14" y="146" font-family="'SF Mono', 'Fira Code', monospace" font-size="11" fill="#d2a8ff">⚡ Ready to code!</text>
  </g>

  <!-- Bottom border accent -->
  <rect x="0" y="316" width="1280" height="4" fill="url(#accent)"/>
</svg>
