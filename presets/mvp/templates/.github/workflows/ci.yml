# =============================================================================
# CI Pipeline — MVP preset
# Runs on every push and PR. Lint, type-check, test, build.
# [CUSTOMIZE] Adjust commands for your stack (npm/pnpm/yarn/pip/cargo).
# =============================================================================
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      # [CUSTOMIZE] Uncomment the setup step for your stack:

      # --- Node.js ---
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check || true

      - name: Test
        run: npm test

      - name: Build
        run: npm run build

