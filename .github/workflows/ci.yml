name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: shellcheck
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y shellcheck jq
          shellcheck --severity=warning scripts/bootstrap.sh scripts/gen_manifest.sh install.sh
          # Template hooks — warn only; they may rely on stack-specific tools
          shellcheck --severity=error templates/hooks/*.sh || true

  smoke:
    name: smoke (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: Generate manifest.json
        run: bash scripts/gen_manifest.sh
      - name: Run smoke suite
        run: bash tests/smoke_test.sh

  bats:
    name: bats (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install bats + jq (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y bats jq
      - name: Install bats + jq (macos)
        if: runner.os == 'macOS'
        run: brew install bats-core jq
      - name: Generate manifest.json
        run: bash scripts/gen_manifest.sh
      - name: Run bats
        run: bats tests/bootstrap_test.bats

  matrix:
    name: bootstrap (${{ matrix.os }} / ${{ matrix.stack }} / ${{ matrix.preset }})
    runs-on: ${{ matrix.os }}
    needs: [smoke]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        stack: [django, flask-next, go, laravel, node, python, react, rust, generic]
        preset: [none, mvp, production-aws, production-gcp]
    steps:
      - uses: actions/checkout@v4
      - name: Install jq (ubuntu)
        if: runner.os == 'Linux'
        run: sudo apt-get update -qq && sudo apt-get install -y jq
      - name: Install jq (macos)
        if: runner.os == 'macOS'
        run: brew install jq
      - name: Generate manifest.json
        run: bash scripts/gen_manifest.sh
      - name: Setup Terraform
        if: startsWith(matrix.preset, 'production-')
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '1.7.0'
      - name: Bootstrap into scratch project
        run: |
          mkdir -p /tmp/proj
          bash scripts/bootstrap.sh /tmp/proj ${{ matrix.stack }} ${{ matrix.preset }}
      - name: Assert settings.json valid
        run: jq empty /tmp/proj/.claude/settings.json
      - name: Assert CLAUDE.md under 200 lines
        run: |
          lines=$(wc -l < /tmp/proj/CLAUDE.md)
          echo "CLAUDE.md: $lines lines"
          test "$lines" -lt 200
      - name: Assert hooks executable
        run: |
          for h in validate-bash secret-scan sast-scan dependency-check auto-format; do
            test -x /tmp/proj/.claude/hooks/${h}.sh || { echo "missing +x: ${h}.sh"; exit 1; }
          done
      - name: Assert core tier has 5 agents
        run: |
          count=$(find /tmp/proj/.claude/agents -maxdepth 1 -name '*.md' | wc -l | tr -d ' ')
          echo "agents: $count"
          test "$count" = "5"
      - name: terraform validate (production-* only)
        if: startsWith(matrix.preset, 'production-')
        working-directory: /tmp/proj/terraform
        run: terraform init -backend=false && terraform validate

  legacy-alias:
    name: production → production-aws alias still works
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y jq
      - run: bash scripts/gen_manifest.sh
      - name: Bootstrap with deprecated preset name
        run: |
          mkdir -p /tmp/proj
          out=$(bash scripts/bootstrap.sh /tmp/proj react production 2>&1)
          echo "$out"
          echo "$out" | grep -q "deprecated alias"
          echo "$out" | grep -q "Applying architecture preset: production-aws"
      - name: Assert AWS terraform was copied
        run: test -f /tmp/proj/terraform/main.tf && grep -q 'hashicorp/aws' /tmp/proj/terraform/main.tf

  re-run-update:
    name: --update refresh path
    runs-on: ubuntu-latest
    needs: [smoke]
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y jq
      - run: bash scripts/gen_manifest.sh
      - name: Fresh install
        run: |
          mkdir -p /tmp/proj
          bash scripts/bootstrap.sh /tmp/proj react mvp
      - name: Modify one file locally
        run: echo "LOCAL HACK" >> /tmp/proj/.claude/rules/security.md
      - name: Re-run with --update
        run: bash scripts/bootstrap.sh /tmp/proj react mvp --update
      - name: Assert unmodified file was refreshed in-place
        run: |
          # settings.json was never touched → should still be valid JSON
          jq empty /tmp/proj/.claude/settings.json
      - name: Assert modified file preserved + sidecar created
        run: |
          grep -q "LOCAL HACK" /tmp/proj/.claude/rules/security.md
          test -f /tmp/proj/.claude/rules/security.md.new
